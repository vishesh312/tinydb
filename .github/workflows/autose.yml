# AutoSE: issue in, reviewed pull request out (DESIGN §3, ADR-002, ADR-010).
#
#   gate -> build(S1-S5) -> round1[ci -> review -> post] -> round2[rework -> ...] -> round3[... final] -> finalize
#
# Agent code is always taken from the DEFAULT branch (`ctl/.autose`), never from a PR branch.
# The tree the agents modify is a separate checkout (`work/`).
name: autose

on:
  issues:
    types: [labeled]
  issue_comment:
    types: [created]
  workflow_dispatch:
    inputs:
      sandbox:
        description: "Also probe the agent sandbox (AUTOSE_SANDBOX=1)"
        type: boolean
        default: false

# Grants nothing; every job declares what it needs (DESIGN §10.1).
permissions: {}

# Only real triggers from trusted people queue per issue; anything else (unrelated comments, comments by
# non-collaborators) gets its own group and exits in the gate, so it can never cancel a queued run
# (DESIGN §11, ADR-010). There are deliberately no job-level groups: they could cancel another run's
# pending rounds. The residual cross-run race is handled by stale-SHA discard (see README).
concurrency:
  group: ${{ ((github.event_name == 'issues' && github.event.label.name == 'autose') || (github.event_name == 'issue_comment' && startsWith(github.event.comment.body, '/autose') && contains(fromJSON('["OWNER","MEMBER","COLLABORATOR"]'), github.event.comment.author_association))) && format('autose-{0}', github.event.issue.number) || format('autose-noop-{0}', github.run_id) }}
  cancel-in-progress: false

env:
  # Harmless leftovers from the Claude CLI; codex never self-updates in `exec` mode.
  DISABLE_UPDATES: "1"
  DISABLE_AUTOUPDATER: "1"
  PYTHONPATH: ${{ github.workspace }}/ctl/.autose
  AUTOSE_HOME: ${{ github.workspace }}/autose-home

jobs:
  gate:
    if: >-
      github.event_name != 'workflow_dispatch' &&
      github.event.sender.type != 'Bot' &&
      ((github.event_name == 'issues' && github.event.label.name == 'autose') ||
       (github.event_name == 'issue_comment' && startsWith(github.event.comment.body, '/autose')))
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      issues: write
      pull-requests: read
      contents: read
    outputs:
      proceed: ${{ steps.gate.outputs.proceed }}
      mode: ${{ steps.gate.outputs.mode }}
      issue: ${{ steps.gate.outputs.issue }}
      pr: ${{ steps.gate.outputs.pr }}
      head_sha: ${{ steps.gate.outputs.head_sha }}
    steps:
      - name: Checkout AutoSE code (default branch only)
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.repository.default_branch }}
          path: ctl
          sparse-checkout: .autose
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install jsonschema
      - name: Authorise trigger (write permission, no bots, no fork PRs)
        id: gate
        env:
          GH_TOKEN: ${{ github.token }}
        run: python -m autose gate

  build:
    needs: gate
    if: needs.gate.outputs.proceed == 'true' && needs.gate.outputs.mode == 'full'
    runs-on: ubuntu-latest
    timeout-minutes: 60
    permissions:
      contents: write
      pull-requests: write
      issues: write
    outputs:
      status: ${{ steps.build.outputs.status }}
      pr: ${{ steps.build.outputs.pr }}
      head_sha: ${{ steps.build.outputs.head_sha }}
      spent_usd: ${{ steps.build.outputs.spent_usd }}
    steps:
      - name: Require the CODEX_AUTH_JSON secret (only its presence is exposed here)
        env:
          HAS_CODEX_AUTH: ${{ secrets.CODEX_AUTH_JSON != '' }}
        run: |
          if [ "$HAS_CODEX_AUTH" != "true" ]; then
            echo "::error::Repository secret CODEX_AUTH_JSON is missing or empty (see README: Maintainer setup)."
            exit 1
          fi
      - name: Job deadline for the orchestrator (ADR-009)
        run: echo "AUTOSE_JOB_DEADLINE=$(( $(date +%s) + 60*60 ))" >> "$GITHUB_ENV"
      - name: Checkout AutoSE code (default branch only)
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.repository.default_branch }}
          path: ctl
          sparse-checkout: .autose
          persist-credentials: false
      - name: Checkout working tree
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.repository.default_branch }}
          path: work
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install project + checker dependencies
        run: pip install -e ./work jsonschema pytest pytest-cov pytest-pycodestyle pytest-mypy mypy pyyaml types-PyYAML
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Install pinned Codex CLI
        run: npm install -g @openai/codex@0.172.0
      - name: Sandbox prerequisites
        if: vars.AUTOSE_SANDBOX == '1'
        run: sudo apt-get update && sudo apt-get install -y bubblewrap socat
      - name: Prepare (token; issue + trusted comments + branch check to files)
        env:
          GH_TOKEN: ${{ github.token }}
        run: python -m autose build --phase prepare --issue "${{ needs.gate.outputs.issue }}" --repo-dir work
      - name: Agents S1-S4 (NO GitHub token in this step)
        env:
          CODEX_AUTH_JSON: ${{ secrets.CODEX_AUTH_JSON }}
          AUTOSE_BACKEND: codex
          AUTOSE_PYTHON: python
          AUTOSE_SANDBOX: ${{ vars.AUTOSE_SANDBOX }}
          AUTOSE_MODEL_ANALYST: ${{ vars.AUTOSE_MODEL_ANALYST }}
          AUTOSE_MODEL_JUDGE: ${{ vars.AUTOSE_MODEL_JUDGE }}
          AUTOSE_MODEL_ARCHITECT: ${{ vars.AUTOSE_MODEL_ARCHITECT }}
          AUTOSE_MODEL_DEVELOPER: ${{ vars.AUTOSE_MODEL_DEVELOPER }}
          AUTOSE_MODEL_TESTER: ${{ vars.AUTOSE_MODEL_TESTER }}
        run: |
          if [ -z "$CODEX_AUTH_JSON" ]; then
            echo "::error::CODEX_AUTH_JSON secret is empty; cannot authenticate the codex CLI."
            exit 1
          fi
          install -d -m 700 "$RUNNER_TEMP/codex-home"
          (umask 077 && printf '%s' "$CODEX_AUTH_JSON" > "$RUNNER_TEMP/codex-home/auth.json")
          chmod 600 "$RUNNER_TEMP/codex-home/auth.json"
          unset CODEX_AUTH_JSON
          export CODEX_HOME="$RUNNER_TEMP/codex-home"
          python -m autose build --phase agent --issue "${{ needs.gate.outputs.issue }}" --repo-dir work
      - name: Remove the Codex login
        if: always()
        run: rm -rf "$RUNNER_TEMP/codex-home"
      - name: Publish S5 (token; final allowlist gate, push, PR, labels, status)
        id: build
        if: ${{ !cancelled() }}
        env:
          GH_TOKEN: ${{ github.token }}
        run: python -m autose build --phase publish --issue "${{ needs.gate.outputs.issue }}" --repo-dir work
      - name: Upload build artifacts (also on stop paths)
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: autose-issue${{ needs.gate.outputs.issue }}-build
          path: autose-home
          overwrite: true
          if-no-files-found: warn

  round1:
    needs: [gate, build]
    if: >-
      !cancelled() && needs.gate.outputs.proceed == 'true' &&
      (needs.build.outputs.status == 'pr-open' || needs.gate.outputs.mode == 'review')
    permissions:
      contents: write
      pull-requests: write
      issues: write
      statuses: write
    uses: ./.github/workflows/autose-round.yml
    with:
      issue: ${{ needs.gate.outputs.issue }}
      pr: ${{ needs.build.outputs.pr || needs.gate.outputs.pr }}
      head_sha: ${{ needs.build.outputs.head_sha || needs.gate.outputs.head_sha }}
      round: 1
      prev_round: 0
      route: ""
      final: ${{ needs.gate.outputs.mode == 'review' }}
      state_artifact: ""
      spent_usd: ${{ needs.build.outputs.spent_usd || '0' }}
    secrets:
      CODEX_AUTH_JSON: ${{ secrets.CODEX_AUTH_JSON }}

  round2:
    needs: [gate, build, round1]
    if: >-
      !cancelled() && needs.gate.outputs.mode == 'full' &&
      needs.round1.outputs.verdict == 'changes_requested'
    permissions:
      contents: write
      pull-requests: write
      issues: write
      statuses: write
    uses: ./.github/workflows/autose-round.yml
    with:
      issue: ${{ needs.gate.outputs.issue }}
      pr: ${{ needs.build.outputs.pr }}
      head_sha: ""
      round: 2
      prev_round: 1
      route: ${{ needs.round1.outputs.route }}
      final: false
      state_artifact: autose-issue${{ needs.gate.outputs.issue }}-build
    secrets:
      CODEX_AUTH_JSON: ${{ secrets.CODEX_AUTH_JSON }}

  round3:
    needs: [gate, build, round2]
    if: >-
      !cancelled() && needs.gate.outputs.mode == 'full' &&
      needs.round2.outputs.verdict == 'changes_requested'
    permissions:
      contents: write
      pull-requests: write
      issues: write
      statuses: write
    uses: ./.github/workflows/autose-round.yml
    with:
      issue: ${{ needs.gate.outputs.issue }}
      pr: ${{ needs.build.outputs.pr }}
      head_sha: ""
      round: 3
      prev_round: 2
      route: ${{ needs.round2.outputs.route }}
      final: true   # after the 2nd send-back the review is final; a human decides (ADR-013)
      state_artifact: autose-issue${{ needs.gate.outputs.issue }}-r2-rework
    secrets:
      CODEX_AUTH_JSON: ${{ secrets.CODEX_AUTH_JSON }}

  finalize:
    needs: [gate, build, round1, round2, round3]
    if: always() && needs.gate.outputs.proceed == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
      issues: write
      pull-requests: write
    steps:
      - name: Checkout AutoSE code (default branch only)
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.repository.default_branch }}
          path: ctl
          sparse-checkout: .autose
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install jsonschema
      - name: Final labels and status line (the bot never merges)
        env:
          GH_TOKEN: ${{ github.token }}
        run: >-
          python -m autose finalize --issue "${{ needs.gate.outputs.issue }}"
          --build-status "${{ needs.gate.outputs.mode == 'review' && 'review-only' || needs.build.outputs.status }}"
          --verdicts "${{ needs.round1.outputs.verdict }},${{ needs.round2.outputs.verdict }},${{ needs.round3.outputs.verdict }}"

  canary:
    # Manual, cheap harness checks before the first real run (DESIGN §10.1). Uses the ChatGPT subscription.
    if: github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
    steps:
      - name: Checkout AutoSE code (default branch only)
        uses: actions/checkout@v4
        with:
          path: ctl
          sparse-checkout: .autose
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install jsonschema
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Install pinned Codex CLI
        run: npm install -g @openai/codex@0.172.0
      - name: Sandbox prerequisites
        if: inputs.sandbox
        run: sudo apt-get update && sudo apt-get install -y bubblewrap socat
      - name: Run canaries (codex smoke call, then harness checks)
        env:
          CODEX_AUTH_JSON: ${{ secrets.CODEX_AUTH_JSON }}
          AUTOSE_BACKEND: codex
          AUTOSE_MODEL_CANARY: ${{ vars.AUTOSE_MODEL_CANARY }}
          AUTOSE_SANDBOX: ${{ inputs.sandbox && '1' || '' }}
        run: |
          if [ -z "$CODEX_AUTH_JSON" ]; then
            echo "::error::Repository secret CODEX_AUTH_JSON is missing or empty (see README: Maintainer setup)."
            exit 1
          fi
          install -d -m 700 "$RUNNER_TEMP/codex-home"
          (umask 077 && printf '%s' "$CODEX_AUTH_JSON" > "$RUNNER_TEMP/codex-home/auth.json")
          chmod 600 "$RUNNER_TEMP/codex-home/auth.json"
          unset CODEX_AUTH_JSON
          export CODEX_HOME="$RUNNER_TEMP/codex-home"
          mkdir -p autose-home
          canary_dir="$(mktemp -d)"
          printf '%s' '{"type":"object","properties":{"answer":{"type":"string"}},"required":["answer"],"additionalProperties":false}' \
            > "$canary_dir/schema.json"
          codex --version
          codex exec --ephemeral -s read-only --skip-git-repo-check -C "$canary_dir" \
            --output-schema "$canary_dir/schema.json" -o autose-home/codex-smoke.json \
            "What is 2+2? Put only the digits in answer." < /dev/null
          python -c 'import json,sys; d=json.load(open(sys.argv[1])); assert d["answer"].strip()=="4", d; print("codex smoke OK:", d)' \
            autose-home/codex-smoke.json
          python -m autose --home autose-home canary
      - name: Remove the Codex login
        if: always()
        run: rm -rf "$RUNNER_TEMP/codex-home"
      - if: always()
        uses: actions/upload-artifact@v4
        with:
          name: autose-canary
          path: autose-home
          overwrite: true
